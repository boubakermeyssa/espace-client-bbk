<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administration — Documents Airtable Agence BBK</title>
  <meta name="robots" content="noindex, nofollow" />

  <!-- Polices Éditoriales Haut de Gamme -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind via CDN + Palette Éditorial Ivoire BBK -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ivoire: {
              DEFAULT: "#FAF9F6",
              card: "#FFFFFF",
              subtle: "#F2EFE9",
              border: "#E7E3DA",
            },
            encre: {
              DEFAULT: "#1C1917",
              muted: "#78716C",
            },
            bronze: {
              DEFAULT: "#967240",
              dark: "#78582F",
            }
          },
          fontFamily: {
            display: ['"Syne"', "sans-serif"],
            sans: ['"Plus Jakarta Sans"', "sans-serif"]
          }
        }
      }
    };
  </script>
</head>

<body class="min-h-screen bg-ivoire font-sans text-encre antialiased p-6 md:p-12">
  <main class="mx-auto max-w-6xl">
    
    <div class="mb-8 flex items-center justify-between border-b border-ivoire-border pb-6">
      <div>
        <a href="/" class="mb-2 inline-flex items-center gap-2 font-display text-[10px] font-bold uppercase tracking-[0.2em] text-bronze hover:underline">
          ← Page d'accueil du studio
        </a>
        <h1 class="font-display text-3xl font-extrabold text-encre">Administration — Documents Airtable</h1>
        <p class="mt-1 text-xs text-encre-muted">Vue d'ensemble de tous les enregistrements enregistrés dans Airtable.</p>
      </div>

      <a href="/espace-client" class="bg-encre px-5 py-3 font-display text-xs font-bold uppercase tracking-[0.2em] text-ivoire hover:bg-bronze transition">
        Espace Client →
      </a>
    </div>

    <div id="status" class="mb-6 border border-ivoire-border bg-ivoire-card p-4 text-xs font-medium text-encre-muted" role="status">
      Chargement des documents...
    </div>

    <div class="overflow-x-auto border border-ivoire-border bg-ivoire-card shadow-sm">
      <table class="w-full text-left text-xs">
        <thead class="border-b border-ivoire-border bg-ivoire-subtle font-display text-[10px] font-bold uppercase tracking-[0.2em] text-encre">
          <tr>
            <th class="p-4">Nom du document</th>
            <th class="p-4">Client</th>
            <th class="p-4">Type</th>
            <th class="p-4">Date</th>
            <th class="p-4">Lien Direct</th>
          </tr>
        </thead>
        <tbody id="documents-body" class="divide-y divide-ivoire-border text-encre"></tbody>
      </table>
    </div>

  </main>

  <script>
    const statusElement = document.getElementById("status");
    const documentsBody = document.getElementById("documents-body");

    function addCell(row, value, extraClass = "") {
      const cell = document.createElement("td");
      cell.className = `p-4 ${extraClass}`;
      cell.textContent = value || "—";
      row.appendChild(cell);
      return cell;
    }

    function addDocumentRow(documentData) {
      const row = document.createElement("tr");
      row.className = "hover:bg-ivoire/60 transition";
      
      addCell(row, documentData.nom, "font-display font-bold text-encre");
      addCell(row, documentData.client, "text-bronze font-semibold");
      
      const typeCell = document.createElement("td");
      typeCell.className = "p-4";
      typeCell.innerHTML = `<span class="border border-encre/20 bg-encre/5 px-2.5 py-1 font-display text-[10px] font-bold uppercase tracking-wider text-encre">[ ${documentData.type || "Autre"} ]</span>`;
      row.appendChild(typeCell);

      addCell(row, documentData.date, "text-encre-muted font-mono");

      const linkCell = document.createElement("td");
      linkCell.className = "p-4";
      if (documentData.url) {
        const link = document.createElement("a");
        link.href = documentData.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.className = "inline-flex items-center gap-1 border border-encre bg-encre px-3 py-1 font-display text-[10px] font-bold uppercase tracking-wider text-ivoire hover:bg-bronze hover:border-bronze transition";
        link.textContent = "Consulter ↗";
        linkCell.appendChild(link);
      } else {
        linkCell.textContent = "—";
      }
      row.appendChild(linkCell);
      documentsBody.appendChild(row);
    }

    async function loadDocuments() {
      try {
        const response = await fetch("/api/documents");
        const payload = await response.json();

        if (!response.ok) {
          throw new Error(payload.error || "Une erreur est survenue.");
        }

        documentsBody.innerHTML = "";
        payload.forEach(addDocumentRow);
        statusElement.className = "mb-6 border border-emerald-500/30 bg-emerald-50 p-4 text-xs font-semibold text-emerald-800";
        statusElement.textContent = payload.length
          ? `✓ ${payload.length} document(s) chargé(s) avec succès.`
          : "Aucun document trouvé.";
      } catch (error) {
        statusElement.className = "mb-6 border border-red-500/30 bg-red-50 p-4 text-xs font-semibold text-red-700";
        statusElement.textContent = error.message || "Impossible de charger les documents.";
      }
    }

    loadDocuments();
  </script>
</body>
</html>
