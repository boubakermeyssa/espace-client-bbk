<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administration — Documents Airtable Agence BBK</title>
  <meta name="robots" content="noindex, nofollow" />

  <!-- Polices Outfit & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind via CDN + Système de design UI Kit Dark Neon -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            dark: {
              DEFAULT: "#0D0D0F",
              card: "#18181C",
              surface: "#141417",
              border: "rgba(255, 255, 255, 0.08)",
            },
            lime: {
              DEFAULT: "#B5F73B",
              hover: "#A2E627",
              soft: "rgba(181, 247, 59, 0.12)",
              border: "rgba(181, 247, 59, 0.25)",
            }
          },
          fontFamily: {
            sans: ['"Outfit"', '"Plus Jakarta Sans"', 'sans-serif'],
            display: ['"Outfit"', 'sans-serif']
          }
        }
      }
    };
  </script>
</head>

<body class="min-h-screen bg-dark font-sans text-white antialiased p-6 md:p-12">
  <main class="mx-auto max-w-6xl">
    
    <div class="mb-8 flex items-center justify-between border-b border-white/10 pb-6">
      <div>
        <a href="/" class="mb-2 inline-flex items-center gap-2 font-display text-xs font-bold uppercase tracking-wider text-lime hover:underline">
          ← Page d'accueil
        </a>
        <h1 class="font-display text-3xl font-extrabold text-white">Administration — Documents Airtable</h1>
        <p class="mt-1 text-xs text-slate-400">Vue globale de tous les enregistrements de la base Airtable.</p>
      </div>

      <a href="/espace-client" class="rounded-full bg-lime px-5 py-2.5 font-display text-xs font-extrabold uppercase tracking-wider text-black shadow-lg shadow-lime/20 hover:bg-white transition">
        Espace Client →
      </a>
    </div>

    <div id="status" class="mb-6 rounded-2xl border border-white/10 bg-dark-card p-4 text-xs font-bold text-slate-300" role="status">
      Chargement des documents...
    </div>

    <div class="overflow-x-auto rounded-3xl border border-white/10 bg-dark-card shadow-2xl">
      <table class="w-full text-left text-xs">
        <thead class="border-b border-white/10 bg-dark-surface font-display text-[11px] font-bold uppercase tracking-wider text-slate-400">
          <tr>
            <th class="p-4">Nom du document</th>
            <th class="p-4">Client</th>
            <th class="p-4">Type</th>
            <th class="p-4">Date</th>
            <th class="p-4">Lien Direct</th>
          </tr>
        </thead>
        <tbody id="documents-body" class="divide-y divide-white/5 text-slate-200"></tbody>
      </table>
    </div>

  </main>

  <script>
    const statusElement = document.getElementById("status");
    const documentsBody = document.getElementById("documents-body");

    function addCell(row, value, extraClass = "") {
      const cell = document.createElement("td");
      cell.className = `p-4 ${extraClass}`;
      cell.textContent = value || "—";
      row.appendChild(cell);
      return cell;
    }

    function addDocumentRow(documentData) {
      const row = document.createElement("tr");
      row.className = "hover:bg-white/[0.02] transition";
      
      addCell(row, documentData.nom, "font-display font-bold text-white");
      addCell(row, documentData.client, "text-lime font-bold");
      
      const typeCell = document.createElement("td");
      typeCell.className = "p-4";
      typeCell.innerHTML = `<span class="rounded-full border border-white/10 bg-white/5 px-3 py-1 font-display text-[10px] font-extrabold uppercase tracking-wider text-slate-300">${documentData.type || "Autre"}</span>`;
      row.appendChild(typeCell);

      addCell(row, documentData.date, "text-slate-400 font-mono");

      const linkCell = document.createElement("td");
      linkCell.className = "p-4";
      if (documentData.url) {
        const link = document.createElement("a");
        link.href = documentData.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.className = "inline-flex items-center gap-1 rounded-full bg-lime px-3 py-1 font-display text-[10px] font-extrabold uppercase tracking-wider text-black hover:bg-white transition";
        link.textContent = "Consulter ↗";
        linkCell.appendChild(link);
      } else {
        linkCell.textContent = "—";
      }
      row.appendChild(linkCell);
      documentsBody.appendChild(row);
    }

    async function loadDocuments() {
      try {
        const response = await fetch("/api/documents");
        const payload = await response.json();

        if (!response.ok) {
          throw new Error(payload.error || "Une erreur est survenue.");
        }

        documentsBody.innerHTML = "";
        payload.forEach(addDocumentRow);
        statusElement.className = "mb-6 rounded-2xl border border-lime/30 bg-lime/10 p-4 text-xs font-bold text-lime";
        statusElement.textContent = payload.length
          ? `✓ ${payload.length} document(s) chargé(s) avec succès.`
          : "Aucun document trouvé.";
      } catch (error) {
        statusElement.className = "mb-6 rounded-2xl border border-red-500/20 bg-red-500/10 p-4 text-xs font-bold text-red-400";
        statusElement.textContent = error.message || "Impossible de charger les documents.";
      }
    }

    loadDocuments();
  </script>
</body>
</html>
