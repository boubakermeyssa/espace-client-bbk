<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administration — Documents Airtable Agence BBK</title>
  <meta name="robots" content="noindex, nofollow" />

  <!-- Polices ultra modernes -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind via CDN + Système de design BBK -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              500: "#6366F1",
              600: "#4F46E5",
              400: "#818CF8",
            },
            surface: {
              dark: "#090D16",
              card: "#111726",
            },
            neon: {
              violet: "#8B5CF6",
              cyan: "#06B6D4",
            }
          },
          fontFamily: {
            heading: ['"Plus Jakarta Sans"', "sans-serif"],
            sans: ["Inter", "sans-serif"]
          }
        }
      }
    };
  </script>
</head>

<body class="min-h-screen bg-surface-dark font-sans text-slate-100 antialiased p-6 md:p-12">
  <main class="mx-auto max-w-6xl">
    
    <div class="mb-8 flex items-center justify-between border-b border-white/10 pb-6">
      <div>
        <a href="/" class="mb-2 inline-flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-brand-400 hover:underline">
          ← Page d'accueil
        </a>
        <h1 class="font-heading text-3xl font-extrabold text-white">Administration — Documents Airtable</h1>
        <p class="mt-1 text-xs text-slate-400">Vue globale de tous les enregistrements de la base Airtable sans filtrage client.</p>
      </div>

      <a href="/espace-client" class="rounded-xl bg-gradient-to-r from-brand-500 to-neon-violet px-4 py-2.5 text-xs font-bold uppercase tracking-wider text-white shadow-lg">
        Accéder à l'espace client →
      </a>
    </div>

    <div id="status" class="mb-6 rounded-xl border border-white/10 bg-surface-card p-4 text-xs font-medium text-slate-300" role="status">
      Chargement des documents...
    </div>

    <div class="overflow-x-auto rounded-2xl border border-white/10 bg-surface-card shadow-2xl">
      <table class="w-full text-left text-xs">
        <thead class="border-b border-white/10 bg-slate-900/60 font-heading text-[11px] font-bold uppercase tracking-wider text-slate-400">
          <tr>
            <th class="p-4">Nom du document</th>
            <th class="p-4">Client associé</th>
            <th class="p-4">Type</th>
            <th class="p-4">Date</th>
            <th class="p-4">Fichier / Lien</th>
          </tr>
        </thead>
        <tbody id="documents-body" class="divide-y divide-white/5 text-slate-200"></tbody>
      </table>
    </div>

  </main>

  <script>
    const statusElement = document.getElementById("status");
    const documentsBody = document.getElementById("documents-body");

    function addCell(row, value, extraClass = "") {
      const cell = document.createElement("td");
      cell.className = `p-4 ${extraClass}`;
      cell.textContent = value || "—";
      row.appendChild(cell);
      return cell;
    }

    function addDocumentRow(documentData) {
      const row = document.createElement("tr");
      row.className = "hover:bg-white/[0.02] transition";
      
      addCell(row, documentData.nom, "font-heading font-bold text-white");
      addCell(row, documentData.client, "text-brand-400 font-medium");
      
      const typeCell = document.createElement("td");
      typeCell.className = "p-4";
      typeCell.innerHTML = `<span class="rounded-lg border border-white/10 bg-white/5 px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider text-slate-300">${documentData.type || "Autre"}</span>`;
      row.appendChild(typeCell);

      addCell(row, documentData.date, "text-slate-400");

      const linkCell = document.createElement("td");
      linkCell.className = "p-4";
      if (documentData.url) {
        const link = document.createElement("a");
        link.href = documentData.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.className = "inline-flex items-center gap-1 rounded-lg bg-brand-500/10 border border-brand-500/30 px-3 py-1 text-[11px] font-bold uppercase tracking-wider text-brand-400 hover:bg-brand-500 hover:text-white transition";
        link.textContent = "Ouvrir ↗";
        linkCell.appendChild(link);
      } else {
        linkCell.textContent = "—";
      }
      row.appendChild(linkCell);
      documentsBody.appendChild(row);
    }

    async function loadDocuments() {
      try {
        const response = await fetch("/api/documents");
        const payload = await response.json();

        if (!response.ok) {
          throw new Error(payload.error || "Une erreur est survenue.");
        }

        documentsBody.innerHTML = "";
        payload.forEach(addDocumentRow);
        statusElement.className = "mb-6 rounded-xl border border-emerald-500/20 bg-emerald-500/10 p-4 text-xs font-semibold text-emerald-400";
        statusElement.textContent = payload.length
          ? `✓ ${payload.length} document(s) chargé(s) avec succès.`
          : "Aucun document trouvé.";
      } catch (error) {
        statusElement.className = "mb-6 rounded-xl border border-red-500/20 bg-red-500/10 p-4 text-xs font-semibold text-red-400";
        statusElement.textContent = error.message || "Impossible de charger les documents.";
      }
    }

    loadDocuments();
  </script>
</body>
</html>
